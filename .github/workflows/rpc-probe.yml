name: Robinhood trace RPC probe
on:
  push:
    branches:
      - feat/verified-indexer
    paths:
      - .github/workflows/rpc-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      ROBINHOOD_RPC_URL: ${{ secrets.ROBINHOOD_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current and historical trace access
        run: |
          if [ -z "$ROBINHOOD_RPC_URL" ]; then
            echo 'ROBINHOOD_RPC_URL secret is missing; trace capability was not tested.'
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          import re
          from urllib.parse import urlsplit
          endpoint = urlsplit(os.environ['ROBINHOOD_RPC_URL'])
          print(json.dumps({
              'endpoint_is_https': endpoint.scheme == 'https',
              'host_is_chainstack_mainnet': endpoint.hostname == 'robinhood-mainnet.core.chainstack.com',
              'has_endpoint_id_path': bool(endpoint.path.strip('/')),
              'endpoint_id_has_expected_shape': bool(re.fullmatch(r'[0-9a-fA-F]{32}', endpoint.path.strip('/'))),
          }))
          PY
          python -m radar.probe
          python -m radar.probe --block 111009151
