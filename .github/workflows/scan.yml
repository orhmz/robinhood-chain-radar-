name: Robinhood data health and discovery
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: robinhood-data-health-main
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source and sample verified contracts
        id: scan
        continue-on-error: true
        run: python -m radar.scan
      - name: Verify bounded contract deployment sample
        id: discover
        continue-on-error: true
        run: python -m radar.discover
      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robinhood-data-health-${{ github.run_id }}
          path: out/*.json
          if-no-files-found: warn
          retention-days: 30
      - name: Save observed head (not coverage)
        if: steps.scan.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Robinhood indexed head observation [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Fail if data access failed
        if: steps.scan.outcome != 'success' || steps.discover.outcome != 'success'
        run: exit 1
