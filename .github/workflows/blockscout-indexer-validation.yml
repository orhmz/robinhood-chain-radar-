name: Blockscout source indexer validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/blockscout-indexer-validation.yml'
      - 'radar/blockscout_indexer.py'
      - 'tests/test_blockscout_indexer.py'

permissions:
  contents: read

jobs:
  bounded-source-check:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s tests -q
      - name: Exhaust a known Robinhood interval
        run: |
          python -m radar.blockscout_indexer \
            --database out/known-validation.sqlite --chain-id 4663 \
            --bootstrap-utc 2026-11-10T16:08:20Z --window-seconds 15 \
            --max-windows 1 --report out/robinhood-source.json
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("out/known-validation.sqlite")
          count = db.execute("""SELECT count(*) FROM source_creations
              WHERE chain_id=4663 AND block_number=111009151
              AND internal_index>=0""").fetchone()[0]
          assert count >= 1, "Known factory creation absent from completed interval"
          PY
      - name: Exhaust six bounded Arc intervals
        run: |
          python -m radar.blockscout_indexer \
            --database out/source-validation.sqlite --chain-id 5042 \
            --bootstrap-utc 2026-11-12T17:36:55Z --window-seconds 300 \
            --max-windows 6 --report out/arc-source.json
      - name: Exhaust and replay six bounded Robinhood intervals
        run: |
          python -m radar.blockscout_indexer \
            --database out/source-validation.sqlite --chain-id 4663 \
            --bootstrap-utc 2026-11-12T17:36:55Z --window-seconds 300 \
            --max-windows 6 --report out/robinhood-batch-source.json
          python - <<'PY'
          import sqlite3
          db = sqlite3.connect("out/source-validation.sqlite")
          count = db.execute("""SELECT count(*) FROM source_windows
              WHERE chain_id=4663 AND start_utc>='2026-11-12T17:36:55Z'""").fetchone()[0]
          assert count == 6, "Expected six complete Robinhood intervals"
          PY
          python -m radar.blockscout_indexer \
            --database out/source-validation.sqlite --chain-id 4663 \
            --bootstrap-utc 2026-11-12T17:36:55Z --window-seconds 300 \
            --max-windows 0 --report out/robinhood-replay-source.json
      - name: Upload source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blockscout-indexer-validation
          path: out/*-source.json
          if-no-files-found: warn
          retention-days: 30
